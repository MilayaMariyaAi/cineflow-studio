[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineflow-studio"
version = "0.1.0"
description = "CineFlow Studio: AI filmmaker skill + MCP server for in-IDE video production (ComfyUI, DaVinci Resolve)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["mcp", "comfyui", "ai-filmmaking", "video", "agent"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]


[project.scripts]
cineflow-mcp = "cineflow_studio.mcp.server:main"
cineflow-mcp-http = "cineflow_studio.mcp.http_transport:main"
cineflow-setup = "cineflow_studio.setup_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cineflow_studio = ["skill/**/*.md", "bin/setup_studio", "bin/install_skill"]
